name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', 'ci/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
      - run: cp android/app/build/outputs/apk/release/app-release.apk TidalChill.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: TidalChill.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tidal Chill v1.0.${{ github.run_number }}
          body: Download TidalChill.apk below and open it on your phone to install or update.
          files: TidalChill.apk
          make_latest: true
      - name: Push build log (for debugging)
        if: always()
        run: |
          mkdir -p out && cp build.log out/ 2>/dev/null || echo "no log" > out/build.log
          cd out && git init -q && git checkout -q -b ci-build && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.run_number }}: ${{ job.status }}"
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ci-build

  emulator-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/emu.sh
      - name: Push screenshots
        if: always()
        run: |
          mkdir -p shots && cd shots && git init -q && git checkout -q -b ci-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${{ github.run_number }}" --allow-empty
          git push -qf https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ci-shots
