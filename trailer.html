<script>
(()=>{
const cvs=document.getElementById('c'), ctx=cvs.getContext('2d',{alpha:false});
const UQ=new URLSearchParams(window.TL_Q||location.search),WALL=UQ.has('wall'),TOPIC=UQ.get('topic'),CHMIN=Math.max(1,+UQ.get('chaos')||6),FPSI=WALL?1000/Math.min(60,Math.max(10,+UQ.get('fps')||30))-2:0;if(WALL)document.body.classList.add('wall');
const PAN=WALL?(UQ.has('pan')?Math.min(2,Math.max(0,+UQ.get('pan')||0)):0.5):0,PAGES=Math.max(2,+UQ.get('pages')||3);let wOff=0.5,wNat=false,wVW=0,tlHidden=false;
let shXf=false;function applyPan(sx=0,sy=0){shXf=!!(sx||sy);const px=PAN?-Math.round(wOff*Math.max(0,W*S-wVW)):0;const v=(px+sx||sy)?'translate3d('+(px+sx)+'px,'+sy+'px,0)':'';if(cvs.style.transform!==v)cvs.style.transform=v;}
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sstep=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

/* ---------- noise ---------- */
const TS=256;
function makeTex(c0,oct){
  const t=new Float32Array(TS*TS);let amp=1,cells=c0;
  for(let o=0;o<oct&&cells<=TS;o++){
    const lat=new Float32Array(cells*cells);for(let i=0;i<lat.length;i++)lat[i]=Math.random();
    const cs=TS/cells;
    for(let y=0;y<TS;y++){const gy=y/cs,y0=Math.floor(gy),f0=gy-y0,fy=f0*f0*(3-2*f0),y1=(y0+1)%cells;
      for(let x=0;x<TS;x++){const gx=x/cs,x0=Math.floor(gx),g0=gx-x0,fx=g0*g0*(3-2*g0),x1=(x0+1)%cells;
        const a=lat[y0*cells+x0],b=lat[y0*cells+x1],c=lat[y1*cells+x0],d=lat[y1*cells+x1];
        const tp=a+(b-a)*fx,bt=c+(d-c)*fx;t[y*TS+x]+=amp*(tp+(bt-tp)*fy);}}
    amp*=0.5;cells*=2;
  }
  let mn=Infinity,mx=-Infinity;for(let i=0;i<t.length;i++){const v=t[i];if(v<mn)mn=v;if(v>mx)mx=v;}
  const k=1/(mx-mn);for(let i=0;i<t.length;i++)t[i]=(t[i]-mn)*k;return t;
}
let texA,texB,texC;
function newTex(){texA=makeTex(4,5);texB=makeTex(16,4);texC=makeTex(32,3);}
const T=(t,x,y)=>t[(((y|0)&255)<<8)|((x|0)&255)];
function hh(x,y,z){let h=Math.imul(x|0,0x27d4eb2d)^Math.imul(y|0,0x165667b1)^Math.imul(z|0,0x9e3779b1);h^=h>>>15;h=Math.imul(h,0x85ebca77);h^=h>>>13;h=Math.imul(h,0xc2b2ae3d);h^=h>>>16;return(h>>>0)/4294967296;}
function vn1(x,s){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f),a=hh(i,s,7),b=hh(i+1,s,7);return a+(b-a)*u;}

/* ---------- palettes through the day ---------- */
const FL=['top','mid','hor','deep','face','cloudD','cloudL','sand','wet','foam','light'];
const key=(p,a)=>{const o={p};FL.forEach((f,i)=>o[f]=hex(a[i]));return o;};
const NIGHT=['#070a1f','#0e1433','#1d2550','#050a18','#10254a','#0c1026','#2a3160','#1e1c2c','#121324','#8591b8','#cfd6ff'];
const KEYS=[
 key(0,NIGHT),key(0.19,NIGHT),
 key(0.22,['#0d1234','#232a5e','#5a4b86','#0a1230','#1c3263','#1d2150','#6a5a96','#3a3350','#221f3c','#a3a3d0','#ffb0a0']),
 key(0.24,['#1c2458','#5b4a8a','#f08a78','#141c44','#2e4a7a','#3b3066','#ff9d86','#6a5160','#3c3050','#e8c8d4','#ffb489']),
 key(0.255,['#2d3f82','#c46a86','#ffc07a','#1b2c5a','#3f7a8e','#6a4a7a','#ffd29a','#a07a6e','#5a4660','#fff0dc','#ffd08a']),
 key(0.28,['#3a64b0','#8fa6d8','#ffd9a8','#1d3f6e','#3f9aa8','#8a86aa','#fff0d0','#cfa98a','#7a6a6e','#fff8ea','#fff0c8']),
 key(0.33,['#2f6cc8','#6ea8e6','#cfe6f2','#134a7a','#2fb0b8','#a8b8d6','#ffffff','#e0c79c','#9c8a74','#ffffff','#ffffff']),
 key(0.5,['#2466d0','#58a0ea','#b8def4','#0e4c80','#26c0c4','#b0c4e0','#ffffff','#ead2a4','#a8927a','#ffffff','#ffffff']),
 key(0.67,['#2f5fbc','#74a2dc','#e8dcc0','#164678','#30a8b0','#b0b0c8','#fff4dc','#dcbc92','#9a8470','#fffaf0','#fff4d8']),
 key(0.72,['#3a58a6','#b89ab4','#ffc680','#1f3e6a','#4aa0a0','#8e7a96','#ffd08a','#d8a47a','#8a6a64','#fff0d0','#ffc878']),
 key(0.745,['#2e2f70','#c0507a','#ff9a4a','#1f2450','#4a7a88','#6a3a6a','#ffb060','#a8645e','#5e3a54','#ffd8b8','#ff9a50']),
 key(0.76,['#1f2258','#7a3a72','#f0704a','#161a40','#2e4a70','#4a2a58','#ff7a58','#6a4458','#3a2848','#e8b0b0','#ff7a50']),
 key(0.78,['#141a46','#3e2e66','#a0506a','#0e1434','#1e3058','#2a2250','#a05a78','#3e3450','#241f3a','#b0a0c8','#d08aa0']),
 key(0.81,['#0a0f2c','#161c46','#2c3060','#080e24','#142a50','#141836','#3a3a6a','#242236','#16162a','#8e96c0','#c8d0ff']),
 key(0.84,NIGHT),key(1.0001,NIGHT)
];
const P={};FL.forEach(f=>P[f]=[0,0,0]);
function palAt(p,out){
  let k=0;while(k<KEYS.length-2&&KEYS[k+1].p<=p)k++;
  const a=KEYS[k],b=KEYS[k+1];let f=clamp((p-a.p)/(b.p-a.p),0,1);f=f*f*(3-2*f);
  for(const n of FL){const A=a[n],B=b[n],O=out[n];O[0]=A[0]+(B[0]-A[0])*f;O[1]=A[1]+(B[1]-A[1])*f;O[2]=A[2]+(B[2]-A[2])*f;}
}

/* ---------- pixel writing (ordered dither) ---------- */
const BAY=new Float32Array([0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16));
const QS=12,IQS=1/12;
let buf,img;
function put(i,x,y,r,g,b){
  const d=BAY[((y&3)<<2)|(x&3)];
  r=Math.floor(r*IQS+d)*QS;g=Math.floor(g*IQS+d)*QS;b=Math.floor(b*IQS+d)*QS;
  r=r>255?255:r<0?0:r;g=g>255?255:g<0?0:g;b=b>255?255:b<0?0:b;
  buf[i]=0xff000000|(b<<16)|(g<<8)|r;
}
let cr=0,cg=0,cb=0;
function rd(i){const v=buf[i];cr=v&255;cg=(v>>>8)&255;cb=(v>>>16)&255;}

/* ---------- state ---------- */
let W,H,S,KS,hy,shoreY,sandH,foam,wet,cmask,swP,swV,swF,swT,rest,back;
let stars=[],island=null,grass=[],waves=[],parts=[],birds=[],shoot=null;
let phase=0.226,time=0,paused=false,spIdx=2;
const SPEEDS=[0.25,0.5,1,2,4,8,16],DAYLEN=300;
let coverage=0.4,covT=0.4,chop=1,chopT=1,swell=1,swellT=1,cloudX=0,bio=0,bioT=0,weatherT=0;
let nextWave=0,setLeft=0,nextSet=20,birdT=8,brk=0,swE=0;
const BR=0.045;

function resize(){if(window.TL_SIZE){if(window.TL_SIZED)return;window.TL_SIZED=1;}
  const vw=Math.max(240,(window.TL_SIZE?TL_SIZE.w:innerWidth)||0),vh=Math.max(160,(window.TL_SIZE?TL_SIZE.h:innerHeight)||0);
  S=Math.max(2,Math.round(vh/178),Math.ceil(vw/720));if(vh>vw*1.25)S=Math.max(2,Math.round(vw/(+UQ.get('px')||140)));
  W=Math.ceil(vw/S);H=Math.ceil(vh/S);
  if(H<110){S=Math.max(1,Math.floor(vh/110));W=Math.ceil(vw/S);H=Math.ceil(vh/S);}
  wVW=vw;if(PAN)W=Math.ceil(W*(1+PAN));
  cvs.width=W;cvs.height=H;cvs.style.width=W*S+'px';cvs.style.height=H*S+'px';
  KS=H/180;hy=Math.round(H*0.47);shoreY=Math.round(H*0.74);sandH=H-shoreY;
  img=ctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);
  foam=new Float32Array(W*H);wet=new Float32Array(W*sandH);cmask=new Uint8Array(W*hy);
  swP=new Float32Array(W);swV=new Float32Array(W);swF=new Float32Array(W);swT=new Float32Array(W);rest=new Float32Array(W);back=new Float32Array(W);

}

function buildScene(){
  const rs=randi(1,1e6);
  for(let x=0;x<W;x++){rest[x]=(0.5+vn1(x*0.07/KS,rs)*2.2)*KS;swP[x]=rest[x];swV[x]=0;swF[x]=0;}
  stars=[];const n=Math.round(W*hy/60);
  for(let i=0;i<n;i++)stars.push({x:randi(0,W-1),y:randi(0,Math.floor(hy*0.88)),b:Math.random()**2*0.85+0.15,f:rand(0.6,3.2),p:rand(0,6.28)});
  const iw=Math.round(rand(26,64)*KS),left=Math.random()<0.5;
  const x0=Math.round(left?rand(0.05,0.2)*W:rand(0.7,0.92)*W-iw);
  const ih=new Float32Array(iw),pk=rand(3,8)*KS,s=randi(1,1e6);let best=0,bi=0;

  island={x0,w:iw,h:ih,lx:bi,lh:Math.random()<0.8,ph:rand(0,5)};
  grass=[];const tufts=randi(1,3);
  for(let t=0;t<tufts;t++){const side=t===0?Math.random()<0.5:Math.random()<0.5;const cx=side?rand(0,W*0.1):rand(W*0.9,W);
    const nb=randi(5,10);for(let b=0;b<nb;b++)grass.push({x:cx+rand(-4,4)*KS,h:rand(5,15)*KS,lean:rand(-0.7,0.7),ph:rand(0,6.28)});}
  lifeInit();
}

function spawnWave(big,t0){
  const A=(big?rand(10,16):rand(5,10.5))*swell*KS;
  const w={t:t0??-0.03,spd:1/rand(13,17),A,ampV:new Float32Array(W),lag:new Float32Array(W),tb:new Float32Array(W),done:new Uint8Array(W),alive:W,s:randi(1,1e6),s2:randi(0,255)};
  const An=clamp((A/KS-3)/10,0,1),tb0=0.58+(1-An)*0.26+rand(-0.04,0.04);
  const r=Math.random(),type=r<0.45?0:r<0.75?1:2,px=rand(0.2,0.8),dir=Math.random()<0.5?-1:1,rate=rand(0.1,0.3);
  const f1=rand(0.012,0.035),f2=rand(0.006,0.02),s=w.s;
  for(let x=0;x<W;x++){
    const xw=x/KS,xn=x/W;
    let av=0.5+0.85*vn1(xw*f1,s)+0.2*(vn1(xw*f1*3.7,s+7)-0.5);
    if(type===1)av*=0.75+0.5*Math.exp(-(((xn-px)/0.18)**2));
    w.ampV[x]=av;
    w.lag[x]=(vn1(xw*f2,s+3)-0.5)*0.07-(av-1)*0.012;
    let tb=tb0+(vn1(xw*0.04,s+5)-0.5)*0.06-(av-1)*0.1;
    if(type===0)tb+=dir*(xn-px)*rate;else if(type===1)tb+=Math.abs(xn-px)*rate;
    w.tb[x]=clamp(tb,0.45,0.965);
  }

}

const yOf=te=>hy+(shoreY-hy)*Math.pow(te,1.9);
const persp=te=>Math.pow(Math.max(te,0.02),1.1);
const C={te:0,yb:0,rows:0,st:0,bp:0,age:0,top:0};
function col(w,x){
  const te=w.t+w.lag[x];C.te=te;if(te<0.012)return false;
  const tb=w.tb[x],hn=w.A*w.ampV[x]*persp(te);let h;
  if(te<tb){C.st=0;C.bp=sstep(tb-0.05,tb,te);h=hn*(1+0.9*sstep(tb-0.35,tb,te));C.age=0;}

function update(dt,dayOn=true){
  time+=dt;
  if(dayOn){
    const g=Math.max(Math.exp(-(((phase-0.255)/0.035)**2)),Math.exp(-(((phase-0.745)/0.035)**2)));
    let m=1-0.7*g;if(sunElev(phase)<-0.3)m*=1.7;

    if(prev<0.79&&phase>=0.79)bioT=Math.random()<0.4?1:0;
    if(prev<0.22&&phase>=0.22)bioT=0;
  }

  coverage+=(covT-coverage)*dt*0.03;chop+=(chopT-chop)*dt*0.05;swell+=(swellT-swell)*dt*0.03;bio+=(bioT-bio)*dt*0.12;
  cloudX=(cloudX+dt*(0.5+chop*0.7)*(1+FS.cloudSpd))%256;
  schedule(dt);

  brk=0;
  for(const w of waves){
    w.t+=dt*w.spd;
    for(let x=0;x<W;x++){
      if(w.done[x])continue;
      if(w.t+w.lag[x]>=1){
        let v0=KS*9+w.A*w.ampV[x]*1.5;if(swV[x]<0)v0*=0.85;
        if(v0>swV[x])swV[x]=v0;swF[x]=1;w.done[x]=1;w.alive--;continue;
      }
      if(!col(w,x))continue;
      if(C.st===1){
        for(let y=C.top;y<=C.yb;y++)dep(x,y,0.3*C.bp+0.15);
        if(Math.random()<dt*14)emit(x,C.top,C.bp,C.rows);
        brk+=C.te*C.te;
      }else if(C.st===2){
        const fr=Math.exp(-C.age*5);
        for(let y=C.top-1;y<=C.yb;y++)dep(x,y,0.32+0.45*fr);
        if(Math.random()<dt*5*fr)emit(x,C.top,0.6,C.rows);
        brk+=fr*0.7*C.te*C.te;
      }
    }
  }
  waves=waves.filter(w=>w.alive>0);

  const g=16*KS,maxB=-14*KS;swE=0;
  for(let x=0;x<W;x++){
    let v=swV[x],p=swP[x];const pv=v;
    if(v>0)v-=(g+v*0.9)*dt;else v-=g*0.55*dt;
    if(v<maxB)v=maxB;p+=v*dt;
    if(pv>0&&v<=0){const yy=Math.round(shoreY+p);dep(x,yy,0.85);dep(x,yy-1,0.55);}
    const rl=rest[x]+FS.surge;if(p<=rl){p=rl;if(v<0)v=0;}
    if(p>sandH-3){p=sandH-3;if(v>0)v=0;}
    swP[x]=p;swV[x]=v;swF[x]*=Math.exp(-dt*0.9);swE+=Math.abs(v);
  }
  for(let x=0;x<W;x++){const l=swP[x>0?x-1:x],r=swP[x<W-1?x+1:x];swT[x]=swP[x]*0.9+(l+r)*0.05;}
  swP.set(swT);
  for(let x=0;x<W;x++){const l=swV[x>0?x-1:x],r=swV[x<W-1?x+1:x];swT[x]=swV[x]*0.9+(l+r)*0.05;}
  swV.set(swT);

  const wd=Math.exp(-dt/18),td=Math.exp(-dt/70);
  for(let y=0;y<sandH;y++){const rel=y+0.5;for(let x=0;x<W;x++){const j=y*W+x;if(rel<swP[x]+0.2){wet[j]=1;track[j]=0;}else{wet[j]*=wd;track[j]*=td;}}}
  const fdS=Math.exp(-dt/2.8),fdB=Math.exp(-dt/2.6),lim=shoreY*W;
  for(let i=hy*W;i<W*H;i++)foam[i]*=i<lim?fdS:fdB;

  lifeUpdate(dt);nukeUpdate(dt);evUpdate(dt);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=26*KS*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}

  if(birdT<=0){birdT=rand(16,45);if(se>-0.05){const n=randi(1,4),dir=Math.random()<0.5?1:-1,y0=rand(0.15,0.6)*hy,sp=rand(9,15)*KS;
    for(let i=0;i<n;i++)birds.push({x:dir>0?-8-i*rand(5,11)*KS:W+8+i*rand(5,11)*KS,y:y0+rand(-6,6)*KS,vx:dir*sp*rand(0.93,1.07),ph:rand(0,6.28),fr:rand(6,9)});}}
  for(let i=birds.length-1;i>=0;i--){const b=birds[i];b.x+=b.vx*dt;if(b.vy){b.y+=b.vy*dt;b.vy*=Math.exp(-dt*0.5);}b.y+=Math.sin(time*0.8+b.ph)*dt*2*KS;if(b.x<-30||b.x>W+30||b.y<-10)birds.splice(i,1);}

  if(shoot){shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;shoot.life-=dt;if(shoot.life<=0)shoot=null;}
}

function renderNukeSky(){if(!NK)return;const n=NK,t=n.t,s=n.s,gx=n.gx;const cD=P.cloudD,cL=P.cloudL,hz=P.hor;

  const sm=[(cD[0]*0.5+cL[0]*0.5)*0.8+40,(cD[1]*0.5+cL[1]*0.5)*0.75+25,(cD[2]*0.5+cL[2]*0.5)*0.7+15];

function mkBolt(x0,y0,x1,y1,n){let pts=[[x0,y0],[x1,y1]],d=Math.abs(y1-y0)*0.3+Math.abs(x1-x0)*0.2;
  for(let k=0;k<n;k++){const np=[pts[0]];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];np.push([(a[0]+b[0])/2+rand(-1,1)*d,(a[1]+b[1])/2+rand(-0.25,0.25)*d]);np.push(b);}pts=np;d*=0.52;}return pts;}
function strike(x0,y0,x1,y1,near,small){const main=mkBolt(x0,y0,x1,y1,small?3:5),br=[],nb=small?randi(0,1):randi(1,4);
  for(let k=0;k<nb;k++){const i=randi(1,Math.max(1,Math.floor(main.length*0.6))),p=main[i],len=Math.abs(y1-y0)*rand(0.15,0.4)+2;br.push(mkBolt(p[0],p[1],p[0]+rand(-1,1)*len*0.8,p[1]+len,small?2:4));}
  const n=small?randi(1,2):randi(1,3),str=[0];for(let k=1;k<n;k++)str.push(str[k-1]+rand(0.05,0.12));
  bolts.push({main,br,t:0,str,near,k:small?0.7:1});}
function sI(o){let I=0;for(const s of o.str)if(o.t>=s)I=Math.max(I,Math.exp(-(o.t-s)/0.045));return I*(o.k||1);}
function thunder(delay,near){if(!AC||!soundOn)return;const t=AC.currentTime+delay,sr=AC.sampleRate,len=sr*7;const b=AC.createBuffer(1,len,sr),d=b.getChannelData(0);let l=0;
  for(let i=0;i<len;i++){l=(l+0.04*(Math.random()*2-1))/1.04;const cr2=near&&i<sr*0.25?(Math.random()*2-1)*0.6*(1-i/(sr*0.25)):0;d[i]=l*3.5+cr2;}
  const s=AC.createBufferSource();s.buffer=b;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(near?3200:900,t);lp.frequency.exponentialRampToValueAtTime(90,t+4);
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(near?1.3:0.45,t+(near?0.02:0.5));g.gain.setTargetAtTime(near?0.5:0.35,t+0.6,0.8);g.gain.exponentialRampToValueAtTime(0.001,t+6.8);
  s.connect(lp).connect(g).connect(master);s.start(t);s.stop(t+7);}
function stormStrike(ev,a,b){const lo=Math.max(b,0)+0.04,hi=Math.min(a,1)-0.04;if(hi<=lo)return;const u=rand(lo,hi),x=ev.dir>0?u*W:(1-u)*W,y0=hy*rand(0.12,0.4);

      for(let y=shoreY-6;y<H;y++)for(let x=0;x<W;x++)dep(x,y,0.95);}
  }else{const ti=t-ev.imp;FX.surge+=sandH*(1-sstep(8,30,ti));FX.noWaves=ti<18;fmax('rumble',0.9*(1-sstep(0,14,ti)));
    if(!ev.f.w2&&ti>22){ev.f.w2=1;spawnWave(true,0.02);const w=waves[waves.length-1];w.A*=2.2;w.spd=1/8;}

// volcano
EVI.volcano=ev=>{const I=island;if(!I.vol)I.vol={orig:Float32Array.from(I.h),lava:new Float32Array(I.w),vk:Math.round(I.w/2)};
  const V=I.vol,vk=V.vk;let mo=0;for(const h of V.orig)mo=Math.max(mo,h);const peak=Math.max(mo*1.5,13*KS),cw=I.w*0.07;
  V.cone=new Float32Array(I.w);for(let k=0;k<I.w;k++){const d=Math.abs(k-vk);let c=peak*Math.pow(Math.max(0,1-d/(I.w*0.5)),1.15);if(d<cw)c-=KS*1.4*(1-d/cw);V.cone[k]=Math.max(c,V.orig[k]);}
  ev.from=Float32Array.from(I.h);ev.dur=118;ev.nb=3;ev.drift=rand(-1,1)*2.5;ev.yN=hy*rand(0.22,0.32);
  toast('Volcano','The island is waking up');};

  if(t<7){shake=Math.max(shake,0.12*sstep(0,7,t));fmax('rumble',0.5*sstep(0,6,t));if(Math.random()<dt*4)VP.push(mkPuff(2,vx+rand(-1,1),vy,0));}

    for(let i=0;i<14;i++)VP.push(mkPuff(0,vx+rand(-2,2)*KS,vy-rand(0,6)*KS,ev));}
  const int=sstep(7,8.5,t)*(1-sstep(46,82,t));volInt=Math.max(volInt,int);fmax('rumble',0.7*int);fmax('dark',0.28*int);
  {let q=dt*(18*int+(t>7&&t<80?1.5:0));while(q>0){if(Math.random()<q)VP.push(mkPuff(0,vx+rand(-2,2)*KS,vy,ev));q-=1;}}

  if(!ev.f.pf&&t>27){ev.f.pf=1;toast('Pyroclastic flow','Racing down the flanks into the sea');}
  if(t>9&&t<52){ev.nb-=dt;if(ev.nb<=0){ev.nb=rand(0.8,3.5);const cs=VP.filter(p=>p.kind===0&&p.age>2&&p.age<14);if(cs.length){const p=cs[randi(0,cs.length-1)];strike(p.x,p.y,p.x+rand(-7,7)*KS,p.y+rand(4,11)*KS,false,true);thunder(rand(1.5,4),false);}}}
  if(t>18&&t<98&&ash.length<260&&Math.random()<dt*16*sstep(18,30,t)*(1-sstep(80,98,t)))ash.push({x:rand(-20,W+20),y:-2,vx:rand(-2,2)*KS+ev.drift*KS,vy:rand(2.5,5)*KS,ph:rand(0,6.28),g:rand(0.3,0.6)});

  if(t>ev.dur)ev.done=true;};
function mkPuff(kind,x,y,ev){if(kind===2)return{kind:2,x,y,vx:rand(-0.5,0.5)*KS,vy:-rand(2,4)*KS,r0:1.2*KS,r:1.2*KS,age:0,life:rand(6,10),s:randi(1,1e5),g:0};
  return{kind:0,x,y,vx:rand(-1,1)*KS,vy:0,v0:rand(9,15)*KS,cx:x,yN:ev.yN*rand(0.8,1.3),drift:ev.drift,r0:rand(3,4.4)*KS,r:3*KS,rmax:rand(8,12)*KS,age:0,life:rand(28,42),s:randi(1,1e5),g:0.9};}

/* ---- update ---- */
function evUpdate(dt){fxReset();
  for(const ev of EVS){ev.t+=dt;EVT[ev.type](ev,dt);}
  if(EVS.some(e=>e.done)){EVS=EVS.filter(e=>!e.done);lifeRestore();evUI();if(!EVS.some(e=>e.type==='tsunami'))tsuFront=null;}
  const r=Math.min(1,dt*1.2);for(const k of FXK)FS[k]+=(FX[k]-FS[k])*r;FS.noWaves=FX.noWaves;
  if(FX.cov>=0){coverage+=(FX.cov-coverage)*Math.min(1,dt*0.4);covT=coverage;}
  if(FX.chop>=0){chop+=(FX.chop-chop)*Math.min(1,dt*0.3);chopT=chop;}
  if(FX.swell>=0){swell+=(FX.swell-swell)*Math.min(1,dt*0.25);swellT=swell;}
  if(EVS.length)LT.gull=Math.max(LT.gull,20);
  evScroll=(evScroll+dt*(1.2+Math.abs(FS.wind)*16)*(FS.wind>=0?1:-1)+256)%256;
  // rain soaks the beach
  if(FS.rain>0.05){const tg=FS.rain*0.95,k=Math.min(1,dt*0.12);for(let j=0;j<wet.length;j++)if(wet[j]<tg)wet[j]+=(tg-wet[j])*k;}
  // wind-torn whitecaps and spume
  if(FS.whitecap>0.03){let n=FS.whitecap*W*0.09*dt*60;while(n>0){if(Math.random()<n){const y=randi(hy+2,shoreY-2),v=(y-hy)/(shoreY-hy),x=randi(0,W-1),L=2+Math.round((1+v*6)*Math.random()),sd=FS.wind>=0?1:-1;for(let k=0;k<L;k++)dep(x+sd*k,y,0.45+0.4*Math.random());}n-=1;}}
  if(FS.spume>0.05&&parts.length<900)for(const w of waves)for(let q=0;q<3;q++){const x=randi(0,W-1);if(w.done[x]||!col(w,x)||C.st===0)continue;if(Math.random()<FS.spume*0.8){const m=rand(0.4,0.9);parts.push({x,y:C.top-1,vx:FS.wind*rand(30,48)*KS,vy:-rand(1,5)*KS,life:m,m});}}
  // lightning & flashes
  flashV=0;for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.t+=dt;const I=sI(b);flashV=Math.max(flashV,I*(b.near?0.6:0.22));if(b.t>0.7)bolts.splice(i,1);}
  for(let i=cfl.length-1;i>=0;i--){const c=cfl[i];c.t+=dt;flashV=Math.max(flashV,sI(c)*0.12);if(c.t>0.7)cfl.splice(i,1);}
  flashV=Math.max(flashV,evFlash);evFlash*=Math.exp(-dt*4.5);ejxUpdate(dt);castleUpdate(dt);
  // volcano puffs, lava
  volInt*=Math.exp(-dt*0.5);
  const I=island;
  if(I.vol&&!evOn('volcano')&&Math.random()<dt*0.7)VP.push(mkPuff(2,I.x0+I.vol.vk+rand(-1,1),hy-I.h[I.vol.vk],0));
  for(let i=VP.length-1;i>=0;i--){const p=VP[i];p.age+=dt;
    if(p.kind===0){const rise=clamp((p.y-p.yN)/(hy*0.3),0,1);p.vy=-p.v0*(0.1+0.9*rise);if(rise<0.35)p.vx+=Math.sign(p.x-p.cx||1)*5*KS*dt*(1-rise/0.35);p.vx*=Math.exp(-dt*0.35);p.x+=(p.vx+p.drift*KS)*dt;p.y+=p.vy*dt;p.r=Math.min(p.rmax*(rise<0.3?1.35:1),p.r0+p.age*1.1*KS);}
    else if(p.kind===1){p.x+=p.vx*dt;p.vx*=Math.exp(-dt*0.25);const h=islH(p.x);p.r=p.r0+p.age*0.7*KS;const ty=h>0?hy-h-p.r*0.35:hy-p.r*0.45-p.age*0.25*KS;p.y+=(ty-p.y)*Math.min(1,dt*6);if(h<=0&&Math.random()<dt*2&&VP.length<420)VP.push(mkPuff(2,p.x,hy-1,0));}
    else if(p.kind===4){p.vx*=Math.exp(-dt*0.6);p.vy*=Math.exp(-dt*0.3);p.x+=(p.vx+FS.wind*4*KS)*dt;p.y+=p.vy*dt;p.r=p.r0+p.age*0.9*KS;}
    else{p.x+=(p.vx+FS.wind*6*KS)*dt;p.y+=p.vy*dt;p.r=p.r0+p.age*(p.kind===3?(p.light?0.35:0.9):0.55)*KS;}
    if(p.age>p.life||p.y<-p.r*2)VP.splice(i,1);}
  if(VP.length>420)VP.splice(0,VP.length-420);

}

function renderSky(){
  const Dk=FX.deck,deckFull=!!Dk&&Dk.a>1.2&&Dk.b<-0.2&&Dk.eye<0.01;
  const top=P.top,mid=P.mid,hor=P.hor,L=P.light,cD=P.cloudD,cL=P.cloudL;
  const g1=0.85*sstep(-0.15,0.02,se),inv1=1/(7*KS),g2=0.5*low*sstep(-0.25,0,se),inv2=1/(60*KS);
  const hbA=0.38*low*sstep(-0.22,0.02,se),hbY=1/(18*KS),hbX=1/(W*0.4);
  const sr=4.5*KS,sr2=sr*sr,sq=1+0.3*(1-clamp(se*5,0,1));
  const sunOn=se>-0.06,st=clamp(se*2.5,0,1);
  const sC0=L[0]+(255-L[0])*st,sC1=L[1]+(250-L[1])*st,sC2=L[2]+(235-L[2])*st;
  const mr=3.2*KS,mr2=mr*mr,moonOn=me>-0.05,mA=0.35+0.65*night;
  const thr=0.8-coverage*0.42,rimK=1/(22*KS);
  for(let y=0;y<hy;y++){
    const v=y/(hy-1);let br,bg,bb;
    if(v<0.55){const f=v/0.55;br=top[0]+(mid[0]-top[0])*f;bg=top[1]+(mid[1]-top[1])*f;bb=top[2]+(mid[2]-top[2])*f;}
    else{let f=(v-0.55)/0.45;f=f*f*(3-2*f);br=mid[0]+(hor[0]-mid[0])*f;bg=mid[1]+(hor[1]-mid[1])*f;bb=mid[2]+(hor[2]-mid[2])*f;}
    const xs=1/(1.6+3.2*v*v),ys=2+v*2,cy=y*ys;
    const band=deckFull?0:sstep(0.03,0.28,v)*(1-sstep(0.82,1,v));
    const hbRow=hbA*Math.exp(-(hy-y)*hbY);
    for(let x=0;x<W;x++){
      const i=y*W+x;cmask[i]=0;
      let r=br,g=bg,b=bb;
      const dx=x-sunX,dy=(y-sunY)*1.5,d=Math.sqrt(dx*dx+dy*dy);
      const gl=g1*Math.exp(-d*inv1)+g2*Math.exp(-d*inv2)+hbRow*Math.exp(-Math.abs(dx)*hbX);
      r+=L[0]*gl;g+=L[1]*gl;b+=L[2]*gl;
      if(me>-0.1){const mdx=x-moonX,mdy=y-moonY,mg=0.35*mA*sstep(-0.1,0.05,me)*Math.exp(-(mdx*mdx+mdy*mdy)/(90*KS*KS));r+=200*mg;g+=210*mg;b+=240*mg;}
      if(sunOn){const qy=(y-sunY)*sq;if(dx*dx+qy*qy<=sr2){r=sC0;g=sC1;b=sC2;}}
      if(moonOn){const mdx=x-moonX,mdy=y-moonY;if(mdx*mdx+mdy*mdy<=mr2){const cr2=hh(Math.round(mdx),Math.round(mdy),9)>0.78?0.82:1;r+=(232*cr2-r)*mA;g+=(236*cr2-g)*mA;b+=(255*cr2-b)*mA;}}
      if(band>0){
        const u=(x-W*0.5)*xs+cloudX;
        let dn=T(texA,u,cy)*0.7+T(texB,u*2.3,cy*2.1)*0.3;
        const c=dn-thr-(1-band)*0.35;
        if(c>0&&!(c<0.03&&BAY[((y&3)<<2)|(x&3)]>0.5)){
          const ll=d>0.001?1/Math.sqrt((lx-x)**2+(ly-y)**2+1):0;
          const ldx=(lx-x)*ll*2.5,ldy=(ly-y)*ll*2.5;
          const u2=(x+ldx-W*0.5)*xs+cloudX,cy2=(y+ldy)*ys;
          const dl=T(texA,u2,cy2)*0.7+T(texB,u2*2.3,cy2*2.1)*0.3;
          const rim=g1*Math.exp(-d*rimK)*1.2;
          let t=clamp(0.38+(dn-dl)*5+rim,0,1.25);
          r=cD[0]+(cL[0]-cD[0])*t+L[0]*rim*0.35;g=cD[1]+(cL[1]-cD[1])*t+L[1]*rim*0.35;b=cD[2]+(cL[2]-cD[2])*t+L[2]*rim*0.35;
          if(c<0.05){r=(r+br)*0.5+L[0]*gl*0.5;g=(g+bg)*0.5+L[1]*gl*0.5;b=(b+bb)*0.5+L[2]*gl*0.5;}
          cmask[i]=1;
        }

  }
  if(night>0.02){for(const s of stars){const i=s.y*W+s.x;if(cmask[i])continue;const k=night*s.b*(0.55+0.45*Math.sin(time*s.f+s.p));if(k<0.08)continue;rd(i);put(i,s.x,s.y,cr+(255-cr)*k,cg+(250-cg)*k,cb+(235-cb)*k);}}
  if(shoot){const a=shoot.life/shoot.m;for(let k=0;k<6;k++){const x=Math.round(shoot.x-shoot.vx*k*0.012),y=Math.round(shoot.y-shoot.vy*k*0.012);if(x<0||x>=W||y<0||y>=hy)continue;const i=y*W+x;const kk=a*(1-k/6);rd(i);put(i,x,y,cr+(255-cr)*kk,cg+(245-cg)*kk,cb+(225-cb)*kk);}}
  renderEvSky();renderNukeSky();
  // island
  const I=island,ic0=P.hor[0]+(P.deep[0]-P.hor[0])*0.55,ic1=P.hor[1]+(P.deep[1]-P.hor[1])*0.55,ic2=P.hor[2]+(P.deep[2]-P.hor[2])*0.55;
  for(let k=0;k<I.w;k++){const x=I.x0+k;if(x<0||x>=W)continue;const h=Math.round(I.h[k]);for(let j=1;j<=h;j++){const y=hy-j;if(y<0)break;put(y*W+x,x,y,ic0,ic1,ic2);}}
  if(I.lh){const x=I.x0+I.lx,h=Math.round(I.h[I.lx]);const tw=Math.max(3,Math.round(3.5*KS));
    for(let j=1;j<=tw;j++){const y=hy-h-j;if(y<0||x<0||x>=W)break;const lt=j%2?0.35:0.15;put(y*W+x,x,y,ic0+(P.foam[0]-ic0)*lt,ic1+(P.foam[1]-ic1)*lt,ic2+(P.foam[2]-ic2)*lt);}
    const ly2=hy-h-tw-1;if(ly2>=0&&x>=0&&x<W){const on=night>0.3&&((time+I.ph)%5)<0.45;if(on){put(ly2*W+x,x,ly2,255,236,150);for(const[ox,oy]of[[1,0],[-1,0],[0,-1]]){const xx=x+ox,yy=ly2+oy;if(xx<0||xx>=W||yy<0)continue;const ii=yy*W+xx;rd(ii);put(ii,xx,yy,(cr+255)/2,(cg+220)/2,(cb+120)/2);}}else put(ly2*W+x,x,ly2,ic0*0.8,ic1*0.8,ic2*0.8);}}
}

function renderSea(){

function renderSand(){
  const Sd=P.sand,Wt=P.wet,Fm=P.foam,Fc=P.face,D=P.deep;
  const shR=Fc[0]*0.6+D[0]*0.4,shG=Fc[1]*0.6+D[1]*0.4,shB=Fc[2]*0.6+D[2]*0.4,so=(time*9)%256;
  for(let y=shoreY;y<H;y++){
    const rel=y-shoreY+0.5,dv=(y-shoreY)/sandH,shade=1-dv*0.14,my=clamp(2*hy-y,0,hy-1);
    for(let x=0;x<W;x++){
      const i=y*W+x,j=(y-shoreY)*W+x,tx=T(texC,x*1.9+5,y*2.7+3);
      const k0=(0.9+0.2*tx)*shade;let R=Sd[0]*k0,G=Sd[1]*k0,B=Sd[2]*k0;
      const wv=wet[j];
      if(wv>0.01){rd(my*W+x);const k=wv;R+=(Wt[0]*(0.92+0.1*tx)-R)*k;G+=(Wt[1]*(0.92+0.1*tx)-G)*k;B+=(Wt[2]*(0.92+0.1*tx)-B)*k;const m=k*0.42;R+=(cr-R)*m;G+=(cg-G)*m;B+=(cb-B)*m;}
      const tk=track[j];if(tk>0.05){const k=0.17*tk;R*=1-k;G*=1-k;B*=1-k*0.8;}
      const p=swP[x];
      if(rel<p){
        const depth=1-rel/(p+1),th=Math.min(1,p/(6*KS)),sk=0.22+0.4*depth*th;
        R+=(shR-R)*sk;G+=(shG-G)*sk;B+=(shB-B)*sk;
        rd(my*W+clamp(x+((T(texB,x*2+so,y*3)*3)|0)-1,0,W-1));R+=(cr-R)*0.3;G+=(cg-G)*0.3;B+=(cb-B)*0.3;
        const fl=swF[x]*(0.35+0.65*depth)+foam[i],lace=fl*(0.45+0.9*T(texB,x*1.6+so,y*2.2+so*0.3));
        if(p-rel<1.3*KS+0.5){if(swV[x]>0.5||lace>0.45){R=Fm[0];G=Fm[1];B=Fm[2];}else{R+=(Fm[0]-R)*0.3;G+=(Fm[1]-G)*0.3;B+=(Fm[2]-B)*0.3;}}
        else if(lace>0.7){R=Fm[0];G=Fm[1];B=Fm[2];}else if(lace>0.52){R=(R+Fm[0])*0.5;G=(G+Fm[1])*0.5;B=(B+Fm[2])*0.5;}
      }else if(rel<p+1.2&&p>rest[x]+0.5){R*=0.86;G*=0.86;B*=0.88;}
      else{const f=foam[i];if(f>0.22){const lace=f*(0.5+0.8*T(texB,x*1.7,y*3.1));if(lace>0.6){R+=(Fm[0]-R)*0.75;G+=(Fm[1]-G)*0.75;B+=(Fm[2]-B)*0.75;}}
        if(wv<0.3&&hh(x,y,3)>0.996){R+=(255-R)*0.22;G+=(245-G)*0.22;B+=(230-B)*0.22;}}

}

function renderWaves(){
  const Fc=P.face,D=P.deep,Fm=P.foam,L=P.light,Hz=P.hor,fb=(time*14)|0;
  const fbR=D[0]+(Fc[0]-D[0])*0.3,fbG=D[1]+(Fc[1]-D[1])*0.3,fbB=D[2]+(Fc[2]-D[2])*0.3;
  const shR=Fm[0]*0.55+Fc[0]*0.45,shG=Fm[1]*0.55+Fc[1]*0.45,shB=Fm[2]*0.55+Fc[2]*0.45;
  waves.sort((a,b)=>a.t-b.t);
  for(const w of waves){
    for(let x=0;x<W;x++){
      if(w.done[x]||!col(w,x))continue;
      const st=C.st,bp=C.bp,rows=C.rows,top=C.top,yb=C.yb;
      if(yb<=hy+1||(FS.draw>0.6&&yb>=shoreY-FS.draw))continue;
      const bk=back[x],kt=0.1+0.4*bk;
      const ftR=Fc[0]+(L[0]-Fc[0])*kt,ftG=Fc[1]+(L[1]-Fc[1])*kt,ftB=Fc[2]+(L[2]-Fc[2])*kt;
      if(st===0&&rows===1){const y=yb-1;if(y>hy&&y<H){const i=y*W+x;rd(i);put(i,x,y,(cr+fbR)*0.5,(cg+fbG)*0.5,(cb+fbB)*0.5);}continue;}
      if(st===0){
        if(rows>=2){const y=top-1;if(y>hy&&y<H){const i=y*W+x;rd(i);put(i,x,y,cr+(Hz[0]-cr)*0.2,cg+(Hz[1]-cg)*0.2,cb+(Hz[2]-cb)*0.2);}}
        for(let r=0;r<rows;r++){const y=top+r;if(y<=hy||y>=H)continue;
          const u=Math.pow(r/(rows-1),0.85);
          let R=ftR+(fbR-ftR)*u,G=ftG+(fbG-ftG)*u,B=ftB+(fbB-ftB)*u;
          const sk=T(texB,x*0.9+w.s,r*3.1+w.s2);
          if(sk>0.68){R+=(ftR-R)*0.45;G+=(ftG-G)*0.45;B+=(ftB-B)*0.45;}else if(sk<0.22){R+=(fbR-R)*0.3;G+=(fbG-G)*0.3;B+=(fbB-B)*0.3;}
          if(r===0){const k=0.3+0.5*bp;R+=(Fm[0]-R)*k;G+=(Fm[1]-G)*k;B+=(Fm[2]-B)*k;
            if(bp>0.3&&hh(x,w.s,fb)<bp*0.55){R=Fm[0];G=Fm[1];B=Fm[2];}}
          put(y*W+x,x,y,R,G,B);}
        if(rows>=3&&yb<H){const i=yb*W+x;rd(i);put(i,x,yb,cr+(fbR-cr)*0.3,cg+(fbG-cg)*0.3,cb+(fbB-cb)*0.3);}
      }else if(st===1){
        const cur=Math.round(bp*(rows-1)),sh=Math.round(bp*rows*0.5)+1;
        for(let k=1;k<=sh;k++){const y=top-k;if(y<=hy)break;const pr=1-k/(sh+1);if(hh(x,y,fb)<pr*0.8){const i=y*W+x;rd(i);const m=0.35+0.5*pr;put(i,x,y,cr+(Fm[0]-cr)*m,cg+(Fm[1]-cg)*m,cb+(Fm[2]-cb)*m);}}
        const tR=Fc[0]*0.55+D[0]*0.45+L[0]*bk*0.25,tG=Fc[1]*0.55+D[1]*0.45+L[1]*bk*0.25,tB=Fc[2]*0.55+D[2]*0.45+L[2]*bk*0.25;
        for(let r=0;r<rows;r++){const y=top+r;if(y<=hy||y>=H)continue;const i=y*W+x;let R,G,B;
          if(r<=1){R=Fm[0];G=Fm[1];B=Fm[2];}
          else if(r<cur){R=tR;G=tG;B=tB;if(hh(x,y,fb)<0.1){R=(R+Fm[0]*1.5)/2.5;G=(G+Fm[1]*1.5)/2.5;B=(B+Fm[2]*1.5)/2.5;}}
          else if(r<=cur+1){if(BAY[((y&3)<<2)|(x&3)]<0.85){R=Fm[0];G=Fm[1];B=Fm[2];}else{R=shR;G=shG;B=shB;}}
          else{const u=Math.pow(r/(rows-1),0.85);R=ftR+(fbR-ftR)*u;G=ftG+(fbG-ftG)*u;B=ftB+(fbB-ftB)*u;}
          put(i,x,y,R,G,B);}
      }else{
        const fr=Math.exp(-C.age*5);
        const jt=Math.round((T(texB,x*2.3+w.s,w.t*260)-0.5)*Math.min(3,rows*0.4)),t0=top-jt,n2=rows+jt;
        if(fr>0.05){for(let k=1;k<=2;k++){const y=t0-k;if(y<=hy)break;if(hh(x,y,fb)<fr*0.5/k){const i=y*W+x;rd(i);put(i,x,y,(cr+Fm[0])*0.5,(cg+Fm[1])*0.5,(cb+Fm[2])*0.5);}}}
        for(let y=t0;y<yb;y++){if(y<=hy||y>=H)continue;
          const u=(y-t0)/Math.max(1,n2-1),n=T(texB,x*1.6+w.s*3,y*2.4+w.t*380);let R,G,B;
          if(u<0.4){if(n<0.22){R=shR;G=shG;B=shB;}else{R=Fm[0];G=Fm[1];B=Fm[2];}}
          else if(u<0.8){if(n>0.42){R=Fm[0];G=Fm[1];B=Fm[2];}else{R=shR;G=shG;B=shB;}}
          else{if(n>0.62){R=shR;G=shG;B=shB;}else{R=(shR+fbR)*0.5;G=(shG+fbG)*0.5;B=(shB+fbB)*0.5;}}
          if(fr<0.35&&n<0.42-fr){const i=y*W+x;rd(i);R=(R+cr)*0.5;G=(G+cg)*0.5;B=(B+cb)*0.5;}
          put(y*W+x,x,y,R,G,B);}
      }
    }
  }
}

const BF=[[[0,1],[1,1],[3,1],[4,1],[2,2]],[[0,0],[4,0],[1,1],[3,1],[2,2]],[[1,1],[2,1],[3,1],[0,2],[2,2],[4,2]]],SEQ=[1,0,2,0];
function renderTop(){
  const Fm=P.foam;
  for(const p of parts){const x=Math.round(p.x),y=Math.round(p.y);if(x<0||x>=W||y<=hy||y>=H)continue;const a=p.life/p.m;if(BAY[((y&3)<<2)|(x&3)]>a*0.95)continue;const i=y*W+x;rd(i);put(i,x,y,cr+(Fm[0]-cr)*0.75,cg+(Fm[1]-cg)*0.75,cb+(Fm[2]-cb)*0.75);}

  for(const b of birds){const glide=Math.sin(time*0.35+b.ph)>0.45;const f=glide?BF[0]:BF[SEQ[Math.floor(time*b.fr+b.ph)&3]];
    const bx=Math.round(b.x)-2,by=Math.round(b.y)-1;for(const[ox,oy]of f){const x=bx+ox,y=by+oy;if(x<0||x>=W||y<0||y>=H)continue;put(y*W+x,x,y,bR,bG,bB);}}
  const gR=P.sand[0]*0.35+P.deep[0]*0.4,gG=P.sand[1]*0.35+P.deep[1]*0.4,gB=P.sand[2]*0.35+P.deep[2]*0.4,tl=0.35*low*lvisSun,L=P.light;
  for(const b of grass){const sw=Math.sin(time*1.3+b.ph)*0.35*(0.5+chop*0.5)+b.lean+FS.wind*(1.5+0.5*Math.sin(time*5+b.ph)),h=Math.round(b.h);

      if(j>=h-2)put(y*W+x,x,y,gR+(L[0]-gR)*tl,gG+(L[1]-gG)*tl,gB+(L[2]-gB)*tl);else put(y*W+x,x,y,gR,gG,gB);}}
}

  let lt=0,lx=0,ly=0;addEventListener('pointerdown',e=>{const now=performance.now();if(now-lt<380&&Math.hypot(e.clientX-lx,e.clientY-ly)<50){surprise();lt=0;}else{lt=now;lx=e.clientX;ly=e.clientY;}},{passive:true});

<div id="pw"><div id="bar"></div></div><div id="st">Loading...</div></div><script>/* Tidal Chill trailer director: drives the real sim (window.TL) frame by frame and

// montage segments sit on a 120 BPM grid (0.5 s beats) so cuts land on the music: ev, length (s), fast-forward into the event (s), time of day, wallpaper offset, playback speed
const SEG=[
 {ev:'storm',    len:1.0, ff:21,  ph:0.56, off:0.5,  sp:1.0, zap:[0.1,0.55], name:'STORM',     col:'#9fb4ff'},
 {ev:'hurricane',len:1.0, ff:59,  ph:0.52, off:0.5,  sp:2.5,                 name:'HURRICANE', col:'#8fe3c8'},
 {ev:'tsunami',  len:1.5, ff:30.2,ph:0.47, off:0.5,  sp:1.6,                 name:'TSUNAMI',   col:'#5fd0ff'},
 {ev:'volcano',  len:1.0, ff:33,  ph:0.71, off:'isl',  sp:1.5,                 name:'VOLCANO',   col:'#ff8a3d'},
 {ev:'meteor',   len:1.5, ff:14.5,ph:0.42, off:0.5,  sp:1.0,                 name:'METEOR',    col:'#ffd166'},
 {ev:'alien',    len:1.0, ff:43.6,ph:0.60, off:0.5,  sp:1.0,                 name:'ALIENS',    col:'#c58bff'},
 {ev:'nuke',     len:1.5, ff:0.25,ph:0.50, off:'nk', sp:1.2,                 name:'NUKE',      col:'#ffb347'},
 {ev:'party',    len:1.0, ff:128, ph:0.80, off:0.5,  sp:1.0,                 name:'BEACH PARTY',col:'#ff6ad5'},
 {ev:'glitch',   len:1.0, ff:52.6,ph:0.50, off:0.5,  sp:1.0,                 name:'GLITCH',    col:'#66ffd9'},
 {ev:'blackhole',len:2.0, ff:77,  ph:0.50, off:0.5,  sp:3.6,                 name:'BLACK HOLE',col:'#ff9a5a', sub:'oh no.'}
];
let acc=C.montage;for(const s of SEG){s.t0=acc;acc+=s.len;s.t1=acc;s.cell=CELLS.findIndex(c=>c[0]===s.ev);}

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,k)=>a+(b-a)*k;
const ease=k=>k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,easeOut=k=>1-Math.pow(1-k,3);
const hash=(a,b=0)=>{let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;};
function rr(X,x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
const PIX='"Pixelify Sans", ui-monospace, monospace',SILK='Silkscreen, ui-monospace, monospace',SANS='"Google Sans", Roboto, "Segoe UI", Arial, sans-serif';
const EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

/* ---------- state ---------- */
let fps=30,seg=-1,ended=false,booted=false,avg=[40,60,110],cueFired=new Set();
const tiny=document.createElement('canvas');tiny.width=tiny.height=1;const TX=tiny.getContext('2d',{willReadFrequently:true});

function boot(){window.TLseed(20261001);TL.time=0;TL.spd=0;TL.newSea();TL.phase=0.70;TL.off=0;for(let k=0;k<45;k++)TL.sim(1/30);seg=-1;ended=false;booted=true;cueFired.clear();}
function setupSeg(s){TL.newSea();TL.ev(s.ev);const n=Math.round(s.ff*30);for(let k=0;k<n;k++)TL.sim(1/30);TL.phase=s.ph;const cx=s.off==='isl'?TL.isl:s.off==='nk'&&TL.nk?TL.nk.gx:null;TL.off=cx!=null?clamp((cx-WV/2)/(TL.W-WV),0,1):s.off;}
function pageAt(t){let p=0;for(const [a,b,f,to] of C.swipes){if(t>=b)p=to;else if(t>a){p=lerp(f,to,ease((t-a)/(b-a)));break;}}return p;}

/* advance the sim to time t (frame i) */
function advance(i){
  const t=i/fps,dt=1/fps;if(!booted||i===0)boot();
  if(t>=C.end){if(!ended){ended=true;TL.newSea();TL.phase=0.735;TL.off=0;for(let k=0;k<20;k++)TL.sim(1/30);}TL.sim(dt);TL.draw();return;}
  const si=SEG.findIndex(s=>t>=s.t0&&t<s.t1);
  if(si>=0){const s=SEG[si];if(si!==seg){seg=si;setupSeg(s);}
    const loc=t-s.t0;if(s.zap)for(const z of s.zap){const key=si+':'+z;if(loc>=z&&!cueFired.has(key)){cueFired.add(key);TL.zap(true);}}
    TL.sim(dt*s.sp);TL.draw();return;}
  // intro: calm sunset beach, wallpaper follows the home-screen page
  TL.off=pageAt(t)/2;TL.sim(dt);TL.draw();
}

/* ---------- drawing ---------- */
function drawBg(X,t){
  const g=X.createLinearGradient(0,0,0,OH);g.addColorStop(0,'#0c1530');g.addColorStop(1,'#04060d');X.fillStyle=g;X.fillRect(0,0,OW,OH);
  const [r,gg,b]=avg;const rg=X.createRadialGradient(540,1040,120,540,1040,900);rg.addColorStop(0,`rgba(${r},${gg},${b},0.55)`);rg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=rg;X.fillRect(0,0,OW,OH);
  for(let k=0;k<70;k++){const x=hash(k,1)*OW,y=(hash(k,2)*OH+t*(8+hash(k,3)*14))%OH,s=hash(k,4)<0.2?6:3,a=0.15+0.35*(0.5+0.5*Math.sin(t*2+k));X.fillStyle=`rgba(220,230,255,${a})`;X.fillRect(Math.round(x/3)*3,Math.round(y/3)*3,s,s);}
}
function drawBoring(X,x,y,w,h){const g=X.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#6f8494');g.addColorStop(1,'#a8b6bd');X.fillStyle=g;X.fillRect(x,y,w,h);
  X.globalAlpha=0.35;X.fillStyle='#8aa0ad';X.beginPath();X.arc(x+w*0.2,y+h*0.32,w*0.55,0,7);X.fill();X.fillStyle='#5f7584';X.beginPath();X.arc(x+w*0.9,y+h*0.78,w*0.6,0,7);X.fill();X.globalAlpha=1;}
function drawSim(X,dx,dy){const H=TL.H,sx=Math.round(TL.off*(TL.W-WV));X.drawImage(TL.cvs,sx,0,WV,H,SC.x+dx,SC.y+dy,WV*PX,H*PX);}

function statusBar(X){X.fillStyle='#fff';X.font=`500 30px ${SANS}`;X.textBaseline='middle';X.textAlign='left';X.fillText('9:41',SC.x+56,SC.y+44);
  const rx=SC.x+SC.w-60;X.fillRect(rx-4,SC.y+33,40,22);X.fillRect(rx+36,SC.y+39,4,10);           // battery
  for(let k=0;k<4;k++)X.fillRect(rx-70+k*9,SC.y+52-k*6-6,6,k*6+6);                                    // signal
  X.beginPath();X.moveTo(rx-108,SC.y+34);X.lineTo(rx-80,SC.y+34);X.lineTo(rx-94,SC.y+56);X.closePath();X.fill();        // wifi
  X.fillStyle='#000';X.beginPath();X.arc(SC.x+SC.w/2,SC.y+44,15,0,7);X.fill();}                  // punch hole
function glance(X,ox){X.save();X.shadowColor='rgba(0,0,0,0.45)';X.shadowBlur=10;X.fillStyle='#fff';X.textAlign='left';X.textBaseline='alphabetic';
  X.font=`400 40px ${SANS}`;X.fillText('Thu, Oct 1',SC.x+56+ox,SC.y+170);X.font=`400 28px ${SANS}`;X.fillText('☀  22°C',SC.x+56+ox,SC.y+214);X.restore();}
function widget(X,ox,press,pressA){const {x,y,w,h}=WG,gx=x+ox;X.save();rr(X,gx,y,w,h,22);X.fillStyle='rgba(8,14,30,0.62)';X.fill();X.strokeStyle='rgba(120,150,210,0.35)';X.lineWidth=2;X.stroke();
  const cw=(w-20-3*8)/4,ch=(h-20-2*8)/3;
  CELLS.forEach((c,i)=>{const cx=gx+10+(i%4)*(cw+8),cy=y+10+Math.floor(i/4)*(ch+8);const on=i===press?pressA:0;
    rr(X,cx,cy,cw,ch,12);X.fillStyle=on?`rgba(${Math.round(lerp(22,255,on))},${Math.round(lerp(36,180,on))},${Math.round(lerp(62,80,on))},0.95)`:'rgba(22,36,62,0.82)';X.fill();
    X.textAlign='center';X.textBaseline='middle';X.font=`34px ${EMO}`;X.fillStyle='#fff';X.fillText(c[1],cx+cw/2,cy+ch*0.4);
    X.font=`15px ${SILK}`;X.fillStyle=on>0.5?'#1a0f05':'#dfe7fb';X.fillText(c[2],cx+cw/2,cy+ch*0.78);});
  X.restore();}
function cellCenter(i){const cw=(WG.w-20-24)/4,ch=(WG.h-20-16)/3;return [WG.x+10+(i%4)*(cw+8)+cw/2,WG.y+10+Math.floor(i/4)*(ch+8)+ch/2];}
function appPage(X,ox,n,seed){const cols=4,sz=104,gap=(SC.w-cols*sz)/(cols+1);const pal=['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#b388ff','#f78c6b','#90be6d','#577590'];
  for(let k=0;k<n;k++){const cx=SC.x+ox+gap+(k%cols)*(sz+gap),cy=SC.y+880+Math.floor(k/cols)*(sz+70);rr(X,cx,cy,sz,sz,30);X.fillStyle=pal[(k+seed)%pal.length];X.fill();
    X.fillStyle='rgba(255,255,255,0.85)';rr(X,cx+sz*0.3,cy+sz*0.3,sz*0.4,sz*0.4,10);X.fill();}}
function dots(X,pg){for(let k=0;k<3;k++){const a=1-Math.min(1,Math.abs(pg-k));X.fillStyle=`rgba(255,255,255,${0.35+0.6*a})`;X.beginPath();X.arc(SC.x+SC.w/2+(k-1)*22,WG.y-26,5+2*a,0,7);X.fill();}}
function touch(X,x,y,age){if(age<0||age>0.45)return;const k=age/0.45;X.save();X.fillStyle=`rgba(255,255,255,${0.45*(1-k)})`;X.beginPath();X.arc(x,y,30,0,7);X.fill();
  X.strokeStyle=`rgba(255,255,255,${0.8*(1-k)})`;X.lineWidth=4;X.beginPath();X.arc(x,y,30+k*46,0,7);X.stroke();X.restore();}

function caption(X,txt,age,dur,size,col,shadow,y0){if(age<0||age>dur)return;const pop=age<0.14?lerp(1.28,1,easeOut(age/0.14)):1;const a=Math.min(1,age/0.06,(dur-age)/0.12);

  const lines=txt.split('\n'),lh=size*1.02,oy=-(lines.length-1)*lh/2;
  lines.forEach((ln,k)=>{X.fillStyle=shadow;X.fillText(ln,7,oy+k*lh+7);X.fillStyle=col;X.fillText(ln,0,oy+k*lh);});X.restore();}

function compose(X,i){
  const t=i/fps;
  if(i%3===0){TX.drawImage(TL.cvs,0,0,1,1);const d=TX.getImageData(0,0,1,1).data;avg=[d[0],d[1],d[2]];}
  drawBg(X,t);
  // phone body
  const s=SEG.find(q=>t>=q.t0&&t<q.t1),loc=s?t-s.t0:0;
  const kick=s&&loc<0.12?1+0.018*(1-loc/0.12):1;
  X.save();X.translate(540,1060);X.scale(kick,kick);X.translate(-540,-1060);
  X.save();X.shadowColor='rgba(0,0,0,0.6)';X.shadowBlur=60;X.shadowOffsetY=30;rr(X,PH.x,PH.y,PH.w,PH.h,PH.r);X.fillStyle='#14161b';X.fill();X.restore();
  const eg=X.createLinearGradient(PH.x,0,PH.x+PH.w,0);eg.addColorStop(0,'#3a3f48');eg.addColorStop(0.5,'#1b1e24');eg.addColorStop(1,'#3a3f48');rr(X,PH.x,PH.y,PH.w,PH.h,PH.r);X.strokeStyle=eg;X.lineWidth=5;X.stroke();
  X.fillStyle='#2a2e36';rr(X,PH.x+PH.w-1,PH.y+300,8,120,4);X.fill();rr(X,PH.x+PH.w-1,PH.y+460,8,70,4);X.fill();
  // screen
  X.save();rr(X,SC.x,SC.y,SC.w,SC.h,SC.r);X.clip();
  const sh=TL.peek().shake||0,dx=Math.round((hash(i,7)-0.5)*sh*14),dy=Math.round((hash(i,8)-0.5)*sh*10);
  if(t<C.glitchIn[0])drawBoring(X,SC.x,SC.y,SC.w,SC.h);
  else if(t<C.glitchIn[1]){drawSim(X,0,0);const k=(t-C.glitchIn[0])/(C.glitchIn[1]-C.glitchIn[0]);const band=24;
    for(let y=0;y<SC.h;y+=band){if(hash(Math.floor(y/band),i)>k){X.save();X.beginPath();X.rect(SC.x,SC.y+y,SC.w,band);X.clip();drawBoring(X,SC.x+(hash(y,i+3)-0.5)*80,SC.y,SC.w,SC.h);X.restore();}
      else if(hash(y,i+9)<0.25){X.globalCompositeOperation='lighter';X.fillStyle='rgba(255,0,120,0.25)';X.fillRect(SC.x,SC.y+y,SC.w,band);X.globalCompositeOperation='source-over';}}}
  else drawSim(X,dx,dy);
  // cut flash
  if(s&&loc<0.1){X.fillStyle=`rgba(255,255,255,${0.75*(1-loc/0.1)})`;X.fillRect(SC.x,SC.y,SC.w,SC.h);}
  if(t>=C.end&&t<C.end+0.25){X.fillStyle=`rgba(255,255,255,${1-(t-C.end)/0.25})`;X.fillRect(SC.x,SC.y,SC.w,SC.h);}
  // home screen overlay
  const pg=t<C.montage?pageAt(t):0,ox=-pg*SC.w;
  glance(X,ox);appPage(X,ox+SC.w,8,0);appPage(X,ox+2*SC.w,4,3);
  let press=-1,pa=0;if(s){press=s.cell;pa=loc<0.3?1-loc/0.3:0;}
  const pre=SEG.find(q=>t>=q.t0-0.18&&t<q.t0);if(pre){press=pre.cell;pa=1;}
  widget(X,ox,press,pa);dots(X,pg);statusBar(X);
  X.fillStyle='rgba(255,255,255,0.8)';rr(X,SC.x+SC.w/2-70,SC.y+SC.h-24,140,7,4);X.fill();
  // touches
  for(const [a,b,f,to] of C.swipes){if(t>=a-0.05&&t<=b+0.05){const k=clamp((t-a)/(b-a),0,1);const dir=to>f?-1:1;touch(X,SC.x+SC.w/2-dir*230+dir*460*ease(k),SC.y+640,t<b?0.05:(t-b)*4);}}
  for(const q of SEG){const age=t-(q.t0-0.18);if(age>=0&&age<0.45){const [cx,cy]=cellCenter(q.cell);touch(X,cx,cy,age);}}
  X.restore();X.restore();
  // captions
  for(const v of C.vo)caption(X,v.txt,t-v.t,v.d,v.txt.includes('\n')?92:100,'#f6ecd9','#2b3a7a',165);
  if(s){caption(X,s.name,loc,s.len,s.name.length>9?112:132,'#fff',s.col,165);
    if(s.sub)caption(X,s.sub,loc-0.55,s.len-0.55,52,'#dfe7fb','rgba(0,0,0,0.6)',262);}
  if(t>=C.endTitle){const age=t-C.endTitle;caption(X,'TIDAL CHILL',age,99,138,'#fff','#ff6ad5',150);caption(X,'YOUR BEACH. YOUR CHAOS.',t-C.endLine,99,50,'#ffd9a8','rgba(0,0,0,0.55)',258);
    const a=clamp((t-C.endLine)/0.3,0,1);X.globalAlpha=a;X.fillStyle='#bcd0ff';X.font=`30px ${SILK}`;X.textAlign='center';X.textBaseline='middle';X.fillText('LIVE WALLPAPER FOR ANDROID',540,1872);X.globalAlpha=1;}
}

/* ---------- public API ---------- */
window.TRAILER={OW,OH,DUR,C,SEG,
  get fps(){return fps},set fps(v){fps=v},
  frame(X,i){advance(i);compose(X,i);},
  frames(){return Math.round(DUR*fps);}
};
})();
</script><script>/* Tidal Chill trailer score: a 20 s chiptune built from the trailer's own cue table.
   Rendered offline with WebAudio, so it always lines up with the cuts. 120 BPM, 0.5 s beats. */
(()=>{
const SR=48000,B=0.5;
const mtof=n=>440*Math.pow(2,(n-69)/12);
const hash=(a,b=0)=>{let h=(Math.round(a*997)*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;};
// chords as midi notes (root first)
const CH={Fmaj7:[53,57,60,64],Em7:[52,55,59,62],Dm7:[50,53,57,60],Am:[57,60,64,69],F:[53,57,60,65],C:[48,52,55,60],G:[55,59,62,67],Cmaj9:[48,52,55,59,62]};

async function render(){
  const T=window.TRAILER,C=T.C,SEG=T.SEG,DUR=T.DUR;
  const ac=new OfflineAudioContext(2,SR*DUR,SR);
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=0.003;comp.release.value=0.18;
  const master=ac.createGain();master.connect(comp).connect(ac.destination);
  master.gain.setValueAtTime(1,0);master.gain.setValueAtTime(1,DUR-0.7);master.gain.linearRampToValueAtTime(0,DUR);
  // reverb from a decaying noise impulse
  const ir=ac.createBuffer(2,SR*1.8,SR);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(hash(i,c+1)*2-1)*Math.pow(1-i/d.length,3);}
  const rev=ac.createConvolver();rev.buffer=ir;const revG=ac.createGain();revG.gain.value=0.25;rev.connect(revG).connect(master);
  const mus=ac.createGain();mus.connect(master);const sfx=ac.createGain();sfx.gain.value=0.85;sfx.connect(master);
  const arpLP=ac.createBiquadFilter();arpLP.type='lowpass';arpLP.frequency.value=3200;arpLP.connect(mus);
  const bassLP=ac.createBiquadFilter();bassLP.type='lowpass';bassLP.frequency.value=900;bassLP.connect(mus);
  const nb=ac.createBuffer(1,SR*2,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=hash(i,9)*2-1;}

  // black hole tape-stop: pitch factor applied to every note after it starts
  const bh=SEG.find(s=>s.ev==='blackhole'),bh0=bh?bh.t0:1e9,bh1=bh?bh.t1:1e9;
  const pf=t=>t<bh0?1:Math.max(0.12,Math.pow(0.5,(Math.min(t,bh1)-bh0)/0.62));

  function tone(type,f,t,dur,peak,dest,o={}){const os=ac.createOscillator();os.type=type;const a=o.a??0.004,rel=o.rel??0.04;
    const f0=f*pf(t),fe=(o.f1||f)*pf(t+dur);os.frequency.setValueAtTime(f0,t);if(Math.abs(fe-f0)>0.01)os.frequency.exponentialRampToValueAtTime(Math.max(5,fe),t+dur);
    if(o.det)os.detune.value=o.det;
    if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg).connect(os.frequency);l.start(t);l.stop(t+dur+0.05);}
    const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);
    if(o.pluck)g.gain.exponentialRampToValueAtTime(1e-4,t+dur);else{g.gain.setValueAtTime(peak,t+Math.max(a,dur-rel));g.gain.linearRampToValueAtTime(0,t+dur);}
    os.connect(g).connect(dest);if(o.send){const s=ac.createGain();s.gain.value=o.send;g.connect(s).connect(rev);}os.start(t);os.stop(t+dur+0.02);}
  function noise(t,dur,peak,dest,o={}){const s=ac.createBufferSource();s.buffer=nb;s.loop=true;const fl=ac.createBiquadFilter();fl.type=o.type||'lowpass';
    fl.frequency.setValueAtTime(o.f||1000,t);if(o.f1)fl.frequency.exponentialRampToValueAtTime(o.f1,t+dur);fl.Q.value=o.q??0.7;
    const g=ac.createGain(),a=o.a??0.004;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);
    if(o.hold){g.gain.setValueAtTime(peak,t+a+o.hold);}g.gain.exponentialRampToValueAtTime(1e-4,t+dur);
    s.connect(fl).connect(g).connect(dest);if(o.send){const sg=ac.createGain();sg.gain.value=o.send;g.connect(sg).connect(rev);}s.start(t,hash(t,3)*1.5);s.stop(t+dur+0.02);}

  const hat=(t,p=0.06)=>noise(t,0.04,p,mus,{type:'highpass',f:7500});
  const crash=(t,p=0.2)=>noise(t,1.2,p,mus,{type:'highpass',f:5200,send:0.35});
  const boom=(t,p=0.8,len=1.2)=>{tone('sine',75,t,len,p,sfx,{f1:24,pluck:1,a:0.003});noise(t,len,p*0.75,sfx,{f:900,f1:70,send:0.2});};
  const whoosh=(t,dur,p,f,f1)=>noise(t,dur,p,sfx,{type:'bandpass',f,f1,q:1.2,a:dur*0.45});

  /* 1. boring elevator chord, then glitch stutter */
  for(const n of [60,64,67])tone('sine',mtof(n),0,C.boringEnd,0.024,mus,{a:0.2,vib:[5,2.5]});
  tone('triangle',mtof(76),0.05,0.4,0.03,mus,{pluck:1,send:0.3});tone('triangle',mtof(74),0.5,0.4,0.03,mus,{pluck:1,send:0.3});
  for(let k=0;k<8;k++){const t=C.glitchIn[0]+k*0.031;tone('square',300+hash(k,5)*1700,t,0.028,0.07,sfx,{a:0.001});}
  noise(C.glitchIn[0],0.25,0.18,sfx,{type:'bandpass',f:3000,f1:400,q:3});

  /* 2. chill groove (lo-fi chiptune) from the glitch to the riser */
  const chill=[[1.0,3.0,'Fmaj7'],[3.0,4.0,'Em7']];
  for(const [a,b,c] of chill){const ch=CH[c];for(const n of ch)tone('triangle',mtof(n),a,b-a,0.03,mus,{a:0.25,rel:0.2,send:0.4});
    for(let t=a,k=0;t<b-1e-6;t+=B/2,k++){tone('square',mtof(ch[[0,1,2,3,2,1][k%6]]+12),t,0.22,0.035,arpLP,{pluck:1,send:0.25});}
    for(let t=a;t<b-1e-6;t+=B)tone('triangle',mtof(ch[0]-12),t,0.42,0.16,bassLP,{pluck:1});}
  for(let t=1.0;t<4.0-1e-6;t+=B){const beat=Math.round(t/B);if(beat%4===2)kick(t,0.55);if(beat%4===0)snare(t,0.16);hat(t+B/2,0.035);}
  for(const [a,b] of C.swipes)whoosh(a,b-a+0.15,0.16,500,3200);

  /* 3. riser into the drop */
  const r0=4.0,r1=C.montage;for(const n of CH.Dm7)tone('triangle',mtof(n),r0,r1-r0,0.025,mus,{a:0.05,rel:0.3,send:0.4});
  noise(r0,r1-r0+0.02,0.22,sfx,{type:'highpass',f:400,f1:7000,a:(r1-r0)*0.95});tone('square',220,r0,r1-r0,0.04,arpLP,{f1:880,a:0.6});
  {let t=r0,step=B/2;while(t<r1-0.03){snare(t,0.06+0.22*(t-r0)/(r1-r0));t+=step;if(t>r0+0.5)step=B/4;if(t>r0+0.8)step=B/8;}}

  /* 4. the drop: full chiptune chaos under the montage */
  const prog=['Am','F','C','G','Am','F'];
  for(let t=C.montage,bi=0;t<bh1-1e-6;t+=B,bi++){
    const bar=Math.floor(bi/4),ch=CH[prog[bar%prog.length]],beat=bi%4,inBH=t>=bh0;
    if(!inBH){kick(t,0.72);if(beat===1||beat===3)snare(t);for(let h=1;h<4;h++)hat(t+h*B/4,h===2?0.07:0.04);}
    if(beat===0){for(const n of ch)tone('sawtooth',mtof(n+12),t,0.28,0.042,mus,{pluck:1,send:0.35});if(!inBH||bi===Math.round((bh0-C.montage)/B))crash(t,0.14);}
    for(let e=0;e<2;e++){const tt=t+e*B/2;tone('sawtooth',mtof(ch[0]-12+(e?12:0)),tt,0.22,0.16,bassLP,{pluck:1});}
    for(let s=0;s<4;s++){const tt=t+s*B/4,k=bi*4+s,pat=[0,1,2,3,4,3,2,1],n=ch[pat[k%8]%ch.length]+12*(1+(pat[k%8]>=4?1:0));tone('square',mtof(n),tt,0.11,0.065,arpLP,{pluck:1,send:0.2});}
  }
  // black hole: drums slow down and sink, a sub drone falls away
  if(bh){[0,0.55,1.15,1.7].forEach((o,k)=>kick(bh0+o,0.55-0.1*k,30));tone('sine',58,bh0,bh1-bh0,0.15,sfx,{f1:22,a:0.3,rel:0.4});
    noise(bh0,bh1-bh0,0.1,sfx,{type:'lowpass',f:2400,f1:120,a:0.8,send:0.4});}

  /* event hits, cut crashes and widget taps */
  for(const s of SEG){const t=s.t0;blip(t-0.18);if(s.ev!=='blackhole')crash(t,0.12);
    switch(s.ev){
      case 'storm':for(const z of s.zap){noise(t+z,0.05,0.35,sfx,{type:'highpass',f:2500});noise(t+z,1.1,0.5,sfx,{f:3500,f1:150,send:0.3});}break;
      case 'hurricane':noise(t,s.len+0.2,0.32,sfx,{type:'bandpass',f:380,f1:1500,q:1.4,a:0.25});break;
      case 'tsunami':noise(t,s.len,0.45,sfx,{f:260,a:0.35,hold:0.6});whoosh(t+0.2,1.0,0.18,800,2600);break;
      case 'volcano':boom(t+0.05,0.7,1.0);break;
      case 'meteor':whoosh(t,0.95,0.32,4200,350);boom(t+1.0,0.85,1.1);break;
      case 'alien':tone('sine',520,t,s.len,0.1,sfx,{vib:[6.5,28],a:0.08,send:0.4});for(const o of [0.25,0.55,0.75])tone('square',1800,t+o,0.13,0.1,sfx,{f1:160,a:0.002});break;
      case 'nuke':tone('sine',2200,t,0.08,0.08,sfx,{pluck:1});boom(t+0.04,0.8,1.5);mus.gain.setValueAtTime(1,t);mus.gain.linearRampToValueAtTime(0.35,t+0.03);mus.gain.linearRampToValueAtTime(1,t+1.1);break;
      case 'party':for(const [o,d] of [[0.02,0.34],[0.45,0.13]])for(const n of [70,74,77])tone('sawtooth',mtof(n),t+o,d,0.05,arpLP,{a:0.01,rel:0.03});break;
      case 'glitch':for(let k=0;k<16;k++){const tt=t+k*B/8;tone('square',200+hash(k,11)*2200,tt,0.05,0.06,sfx,{a:0.001});if(k%2)mus.gain.setValueAtTime(0,tt);else mus.gain.setValueAtTime(1,tt);}
        mus.gain.setValueAtTime(1,s.t1);noise(t,s.len,0.12,sfx,{type:'bandpass',f:5000,f1:300,q:6});break;
    }}

  /* 5. end card: soft landing */
  const e0=C.end;kick(e0,0.7);crash(e0,0.18);for(const n of CH.Cmaj9)tone('triangle',mtof(n),e0,DUR-e0,0.02,mus,{a:0.08,rel:0.8,send:0.5});
  tone('triangle',mtof(36),e0,DUR-e0,0.07,bassLP,{a:0.02,rel:0.8});
  for(let t=e0+0.25,k=0;t<DUR-0.3;t+=B/2,k++)tone('sine',mtof(CH.Cmaj9[k%5]+24),t,0.5,0.05,mus,{pluck:1,send:0.5});

  const buf=await ac.startRendering();
  let pk=0;for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>pk)pk=v;}}
  if(pk>0){const g=0.95/pk;for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=g;}}
  return buf;
}
let cache=null;
window.TRAILER_MUSIC={render:()=>cache||(cache=render())};
})();
</script><script>/* Trailer player UI: preview + GPU export (WebCodecs H.264/VP9 + Opus audio via mp4-muxer) */
(()=>{
const $=id=>document.getElementById(id),T=window.TRAILER;
const cv=$('out'),X=cv.getContext('2d');cv.width=T.OW;cv.height=T.OH;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let musicBuf=null;

let pctx=null,psrc=null;

function prog(f){$('bar').style.width=Math.round(f*100)+'%';}

async function preview(){if(busy)return;busy=true;cancel=false;await fontsReady();T.fps=+$('fps').value;const n=T.frames();

  try{
    const br=fps>30?16e6:11e6;let cfg=null,mc='avc';
    for(const cd of ['avc1.640033','avc1.640032','avc1.640028','avc1.4d0033','avc1.4d0028','avc1.42e033']){const c={codec:cd,width:w,height:h,bitrate:br,framerate:fps,avc:{format:'avc'}};try{if((await VideoEncoder.isConfigSupported(c)).supported){cfg=c;break;}}catch(e){}}

      const total=Math.min(ab.length,Math.round(T.DUR*48000)),L=ab.getChannelData(0),R=ab.numberOfChannels>1?ab.getChannelData(1):L,CH=4800;

      await aenc.flush();}

    status('Done: '+(blob.size/1048576).toFixed(1)+' MB'+(acfg?' with sound':ab?' (no Opus encoder here, video only)':''));window.__lastExport=blob;a.click();
  }catch(e){status('Export failed: '+e.message);console.error(e);}

fontsReady().then(()=>{T.fps=+$('fps').value;T.frame(X,0);for(let i=1;i<=Math.round(0.4*T.fps);i++)T.frame(X,i);status('Ready. Preview or export.');});
